<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5DF6"/>
      <stop offset="100%" stop-color="#A232F9"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#bg)"/>
  
  <g fill="none" stroke="white" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brain left hemisphere shape -->
    <path d="M 45 28 
             C 30 25, 22 36, 28 44
             C 18 48, 18 62, 28 66
             C 25 74, 38 80, 46 72
             C 52 65, 48 58, 45 55
             C 48 50, 48 40, 45 35
             C 50 30, 48 28, 45 28 Z"/>
    
    <!-- Top circuit -->
    <path d="M 45 35 L 70 35"/>
    <circle cx="70" cy="35" r="4" fill="white" stroke="none"/>
    
    <!-- Middle circuit -->
    <path d="M 48 50 L 62 50"/>
    <circle cx="62" cy="50" r="4" fill="white" stroke="none"/>
    
    <!-- Bottom circuit -->
    <path d="M 45 65 L 68 65 L 68 75 L 75 75"/>
    <circle cx="75" cy="75" r="4" fill="white" stroke="none"/>
  </g>
</svg>
